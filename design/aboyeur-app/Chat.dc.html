<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --line: #d2d2d7; --fill: #ececee; --fill-strong: #e2e2e6;
    --danger: #ff3b30; --success: #34c759; --warn: #ff9500;
    --bubble-user: var(--accent); --bubble-assist: #e9e9eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #000000; --ink: #f5f5f7; --muted: #98989d;
      --line: #38383a; --fill: #2c2c2e; --fill-strong: #3a3a3c;
      --danger: #ff453a; --success: #30d158; --warn: #ff9f0a;
      --bubble-assist: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--card); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input { font-family: inherit; }

  .app { display: flex; flex-direction: column; width: 100%; height: 900px; background: var(--card); }

  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .app-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(155deg, var(--accent), var(--success));
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .app-name { font-size: 15px; font-weight: 700; }
  .profile-chip { font-size: 12.5px; color: var(--muted); }
  .topbar-spacer { flex: 1; }
  .icon-btn-round { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--fill);
    color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .thread { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
  .msg-row { display: flex; gap: 10px; max-width: 640px; }
  .msg-row-user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row-assist { align-self: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #ffffff; }
  .avatar-assist { background: linear-gradient(155deg, var(--accent), var(--success)); }
  .avatar-user { background: var(--fill-strong); color: var(--ink); }

  .bubble { border-radius: 18px; padding: 11px 15px; font-size: 15px; line-height: 1.4; }
  .bubble-user { background: var(--bubble-user); color: #ffffff; border-bottom-right-radius: 5px; }
  .bubble-assist { background: var(--bubble-assist); color: var(--ink); border-bottom-left-radius: 5px; }

  .card { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); width: 340px; }
  .card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted);
    padding: 10px 14px 6px; }
  .menu-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); }
  .menu-day { font-size: 12.5px; font-weight: 700; color: var(--muted); width: 34px; flex-shrink: 0; }
  .menu-dish { flex: 1; font-size: 13.5px; font-weight: 500; }
  .menu-kcal { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .status-pill { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 980px; flex-shrink: 0; text-transform: uppercase; }
  .status-ok { background: rgba(52,199,89,0.15); color: #248a3d; }
  .status-under { background: rgba(255,149,0,0.16); color: #b06500; }
  .status-over { background: rgba(255,59,48,0.14); color: var(--danger); }

  .shop-group-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--muted); background: var(--fill); padding: 6px 14px; }
  .shop-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
  .shop-name { flex: 1; }
  .shop-amt { font-size: 12px; color: var(--muted); }
  .have-tag { font-size: 10px; font-weight: 700; color: var(--success); padding: 2px 6px; border-radius: 6px; background: rgba(52,199,89,0.14); }

  .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: 0.5; }

  .suggest-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 22px 12px; flex-shrink: 0; }
  .suggest-chip { padding: 8px 14px; border-radius: 980px; border: 1px solid var(--line); background: var(--fill);
    color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; }

  .composer { display: flex; align-items: flex-end; gap: 10px; padding: 12px 22px 18px; border-top: 1px solid var(--line); flex-shrink: 0; }
  .composer-input { flex: 1; min-height: 40px; max-height: 120px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--fill); color: var(--ink); font-size: 15px; padding: 10px 16px; resize: none; }
  .send-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent); color: #ffffff;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send-btn-off { opacity: 0.4; }
</style>
</helmet>

<div class="app" style="--accent: {{accent}};">

  <div class="topbar">
    <div class="app-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 3 1.5 5 2 7h8c.5-2 2-4 2-7Z"/><path d="M9 21h6"/><path d="M10 18h4"/></svg>
    </div>
    <div>
      <div class="app-name">Aboyeur</div>
      <div class="profile-chip">Me · 3 meals/day · Shellfish, Peanut-free</div>
    </div>
    <div class="topbar-spacer"></div>
    <button type="button" class="icon-btn-round" aria-label="Profile">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
    </button>
  </div>

  <div class="thread">
    <sc-for list="{{messages}}" as="m" hint-placeholder-count="5">
      <div class="{{m.rowCls}}">
        <div class="{{m.avatarCls}}">{{m.avatarLabel}}</div>
        <div>
          <sc-if value="{{m.hasText}}" hint-placeholder-val="{{true}}">
            <div class="{{m.bubbleCls}}">{{m.text}}</div>
          </sc-if>
          <sc-if value="{{m.isMenu}}" hint-placeholder-val="{{false}}">
            <div class="card">
              <div class="card-title">This week</div>
              <sc-for list="{{m.menuRows}}" as="row" hint-placeholder-count="3">
                <div class="menu-row">
                  <span class="menu-day">{{row.day}}</span>
                  <span class="menu-dish">{{row.dish}}</span>
                  <span class="menu-kcal">{{row.kcal}} kcal</span>
                  <span class="{{row.statusCls}}">{{row.statusLabel}}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{m.isShopping}}" hint-placeholder-val="{{false}}">
            <div class="card">
              <sc-for list="{{m.shoppingGroups}}" as="grp" hint-placeholder-count="3">
                <div>
                  <div class="shop-group-title">{{grp.section}}</div>
                  <sc-for list="{{grp.items}}" as="item" hint-placeholder-count="3">
                    <div class="shop-row">
                      <span class="shop-name">{{item.name}}</span>
                      <span class="shop-amt">{{item.amount}}</span>
                      <sc-if value="{{item.have}}" hint-placeholder-val="{{false}}">
                        <span class="have-tag">Have</span>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{isTyping}}" hint-placeholder-val="{{false}}">
      <div class="msg-row msg-row-assist">
        <div class="avatar avatar-assist">A</div>
        <div class="bubble bubble-assist">
          <div class="typing-dots">
            <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
          </div>
        </div>
      </div>
    </sc-if>
  </div>

  <div class="suggest-row">
    <sc-for list="{{suggestions}}" as="s" hint-placeholder-count="3">
      <button type="button" class="suggest-chip" onClick="{{s.send}}">{{s.label}}</button>
    </sc-for>
  </div>

  <div class="composer">
    <textarea class="composer-input" rows="1" value="{{draft}}" onChange="{{setDraft}}" placeholder="Message Aboyeur"></textarea>
    <button type="button" class="{{sendBtnCls}}" onClick="{{sendDraft}}" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-6 18-3.5-7.5L3 11.5Z"/></svg>
    </button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#0071e3","options":["#0071e3","#ff375f","#34c759","#ff9500","#af52de"]},"$preview":{"width":900,"height":900}}'>

const MENU_ROWS = [
  { day: "Mon", dish: "Chicken Tikka Masala", kcal: 520, status: "ok" },
  { day: "Tue", dish: "Miso Glazed Salmon", kcal: 440, status: "under" },
  { day: "Wed", dish: "Falafel Bowl", kcal: 470, status: "ok" },
];

const SHOPPING_GROUPS = [
  { section: "Produce", items: [
    { name: "Cilantro", amount: "1 bunch", have: false },
    { name: "Lemon", amount: "4", have: true },
    { name: "Spinach", amount: "200g", have: false },
  ]},
  { section: "Protein", items: [
    { name: "Chicken thigh", amount: "900g", have: false },
    { name: "Salmon fillet", amount: "2 fillets", have: false },
  ]},
  { section: "Pantry", items: [
    { name: "Garam masala", amount: "2 tbsp", have: true },
    { name: "White miso", amount: "3 tbsp", have: false },
  ]},
];

const STATUS_LABEL = { ok: "On target", under: "Under", over: "Over" };
const STATUS_CLASS = { ok: "status-pill status-ok", under: "status-pill status-under", over: "status-pill status-over" };

function seedMessages() {
  return [
    { id: 1, from: "assistant", kind: "text",
      text: "Hey! Your household profile's set — 3 meals a day, allergic to shellfish and peanut, leaning Italian and Indian. Want me to plan this week's menu?" },
    { id: 2, from: "user", kind: "text", text: "Plan my week" },
    { id: 3, from: "assistant", kind: "menu",
      text: "Here's Monday through Wednesday — kept it under your daily target and reused ingredients across days to keep the grocery list short.",
      menuRows: MENU_ROWS },
    { id: 4, from: "user", kind: "text", text: "Swap Tuesday's dinner, not feeling cauliflower" },
    { id: 5, from: "assistant", kind: "text",
      text: "Swapped: Kung Pao Cauliflower → Miso Glazed Salmon. Still 440 kcal, right on target." },
  ];
}

class Component extends DCLogic {
  idCounter = 100;

  state = { messages: seedMessages(), draft: "", isTyping: false };

  setDraft = (e) => this.setState({ draft: e.target.value });

  buildReply = (text) => {
    const lower = text.toLowerCase();
    this.idCounter += 1;
    const id = this.idCounter;
    if (lower.includes("shopping") || lower.includes("grocery")) {
      return { id, from: "assistant", kind: "shopping",
        text: "Here's the list, grouped by aisle. Items you already have are marked.",
        shoppingGroups: SHOPPING_GROUPS };
    }
    if (lower.includes("swap")) {
      return { id, from: "assistant", kind: "text",
        text: "Swapped it for Miso Glazed Salmon — still within your calorie target and keeps the shellfish-free rule." };
    }
    if (lower.includes("plan") || lower.includes("menu") || lower.includes("week")) {
      return { id, from: "assistant", kind: "menu",
        text: "Here's the plan — kept it under your daily target and reused ingredients to keep the grocery list short.",
        menuRows: MENU_ROWS };
    }
    if (lower.includes("dinner") || lower.includes("tonight")) {
      return { id, from: "assistant", kind: "text",
        text: "Tonight's pick: Miso Glazed Salmon — 440 kcal, 36g protein. Want something else instead?" };
    }
    return { id, from: "assistant", kind: "text",
      text: "Got it — I'll factor that in. Want me to plan this week's menu or pull up the shopping list?" };
  };

  addUserMessage = (text) => {
    const trimmed = (text || "").trim();
    if (!trimmed) return;
    this.idCounter += 1;
    const userMsg = { id: this.idCounter, from: "user", kind: "text", text: trimmed };
    this.setState({ messages: [...this.state.messages, userMsg], draft: "", isTyping: true });
    setTimeout(() => {
      const reply = this.buildReply(trimmed);
      this.setState({ messages: [...this.state.messages, reply], isTyping: false });
    }, 700);
  };

  sendDraft = () => this.addUserMessage(this.state.draft);
  sendChip = (text) => () => this.addUserMessage(text);

  renderVals() {
    const s = this.state;
    const accent = this.props.accent || "#0071e3";

    const messages = s.messages.map((m) => {
      const isUser = m.from === "user";
      const menuRows = (m.menuRows || []).map((r) => ({
        ...r, statusLabel: STATUS_LABEL[r.status] || r.status, statusCls: STATUS_CLASS[r.status] || "status-pill",
      }));
      return {
        ...m,
        rowCls: "msg-row " + (isUser ? "msg-row-user" : "msg-row-assist"),
        avatarCls: "avatar " + (isUser ? "avatar-user" : "avatar-assist"),
        avatarLabel: isUser ? "M" : "A",
        bubbleCls: "bubble " + (isUser ? "bubble-user" : "bubble-assist"),
        hasText: !!m.text,
        isMenu: m.kind === "menu",
        isShopping: m.kind === "shopping",
        menuRows,
        shoppingGroups: m.shoppingGroups || [],
      };
    });

    const suggestions = [
      { label: "Show shopping list", send: this.sendChip("Show shopping list") },
      { label: "What's for dinner tonight?", send: this.sendChip("What's for dinner tonight?") },
      { label: "Plan next week too", send: this.sendChip("Plan next week too") },
    ];

    const canSend = (s.draft || "").trim().length > 0;

    return {
      accent,
      messages, isTyping: s.isTyping,
      suggestions,
      draft: s.draft, setDraft: this.setDraft,
      sendDraft: this.sendDraft,
      sendBtnCls: "send-btn" + (canSend ? "" : " send-btn-off"),
    };
  }
}
</script>
</body>
</html>

[project]
name = "aboyeur"
version = "0.1.0"
description = "Conversational nutritionist/menu-maker over a 60k-recipe personal cookbook library"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.7",
    "openai>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aboyeur = "aboyeur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# .venv lives on the NAS-mounted volume this project is on; uv's cache is on
# local disk. Hardlinking across that filesystem boundary fails and silently
# falls back to a copy that can drop files (hit this for real: openai 2.46.0
# installed missing _models.py, _compat.py, _exceptions.py, _module_client.py,
# _qs.py — package imported fine at the top level, broke only once something
# tried to import the missing submodules). Force copy mode outright.
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["aboyeur"]

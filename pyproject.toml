[project]
name = "aboyeur"
version = "0.1.0"
description = "Conversational nutritionist/menu-maker over a 60k-recipe personal cookbook library"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.7",
    "openai>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    # backend/main.py's runtime deps — previously installed ad hoc into the
    # venv (never declared here), so a plain `uv sync` silently uninstalled
    # them. Kept loose to match what was already running; see
    # backend/requirements.txt for the Docker image's own pin of these.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "chromadb>=0.5",
    "fastmcp>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aboyeur = "aboyeur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# .venv lives on the NAS-mounted volume this project is on; uv's cache is on
# local disk. Hardlinking across that filesystem boundary fails and silently
# falls back to a copy that can drop files (hit this for real: openai 2.46.0
# installed missing _models.py, _compat.py, _exceptions.py, _module_client.py,
# _qs.py — package imported fine at the top level, broke only once something
# tried to import the missing submodules). Force copy mode outright.
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["aboyeur"]
